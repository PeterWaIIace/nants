[project]
name = "nants"
version = "0.1.0"
description = "A colony of memoryless ants that paints a picture"
readme = "README.md"
authors = [
    { name = "Iliya Zhechev", email = "iliya.zhechev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "torch>=2.13.0",
    "tqdm>=4.66.5",
]

[project.scripts]
nants-train = "nants.train:main"
nants-menagerie = "nants.menagerie:main"
nants-flock = "nants.flock:main"
nants-showcase = "nants.shows.showcase:main"
nants-crowd = "nants.shows.crowd:main"
nants-colony = "nants.shows.colony:main"
nants-regen = "nants.shows.regen:main"
nants-twist = "nants.shows.twist:main"
nants-partial = "nants.shows.partial:main"
nants-scatter = "nants.shows.scatter:main"
nants-paint = "nants.shows.paint:main"
nants-sample = "nants.shows.sample:main"
nants-weights = "nants.shows.export_weights:main"
nants-brains = "nants.shows.export_brains:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu" }

[[tool.uv.index]]
name = "pytorch-cu"
url = "https://download.pytorch.org/whl/cu129"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
